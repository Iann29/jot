# Jot - floating notes
# Source this file from your hyprland.conf:
#   source = ~/.config/hypr/jot.conf
#
# Targets Hyprland 0.53+ (windowrule v3 syntax). Effect comes first, the
# match:class clause comes second - matching the form Omarchy uses.

# Global toggle: Super+N
bindd = SUPER, N, Jot, exec, jot

# Window behaviour: floating, pinned, centered, sized, rounded
windowrule = float on,     match:class ^(com.amageweb.Jot)$
windowrule = pin on,       match:class ^(com.amageweb.Jot)$
windowrule = center on,    match:class ^(com.amageweb.Jot)$
windowrule = size 820 620, match:class ^(com.amageweb.Jot)$
windowrule = rounding 16,  match:class ^(com.amageweb.Jot)$
windowrule = noshadow,     match:class ^(com.amageweb.Jot)$

# Optional - blur whatever is behind the window:
# layerrule = blur, com.amageweb.Jot
