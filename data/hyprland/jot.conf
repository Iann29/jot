# Jot - floating notes
# Source this file from your hyprland.conf:
#   source = ~/.config/hypr/jot.conf
#
# Targets Hyprland 0.53+ (windowrule v3 syntax).

# Global toggle: Super+N
bindd = SUPER, N, Jot, exec, jot
# Screen-region GIF recorder: Super+R fires the mini-overlay
bindd = SUPER, R, Jot record GIF, exec, jot --record-gif

# Main window rules — floating, pinned, centered, sized, rounded
windowrule = float on,     match:class ^(jot|com\.amageweb\.Jot)$, match:title ^(Jot)$
windowrule = pin on,       match:class ^(jot|com\.amageweb\.Jot)$, match:title ^(Jot)$
windowrule = center on,    match:class ^(jot|com\.amageweb\.Jot)$, match:title ^(Jot)$
windowrule = size 820 620, match:class ^(jot|com\.amageweb\.Jot)$, match:title ^(Jot)$
windowrule = rounding 16,  match:class ^(jot|com\.amageweb\.Jot)$, match:title ^(Jot)$

# Recorder overlay — a compact bar, pinned. No size rule: the app sizes
# itself to its content (~40px tall) and picks its own position from the
# saved Super+drag spot or an auto-corner fallback via hyprctl.
windowrule = float on,           match:title ^(Jot Recorder)$
windowrule = pin on,             match:title ^(Jot Recorder)$
windowrule = rounding 10,        match:title ^(Jot Recorder)$

# Placement picker — shown on first use (and when the user resets the
# overlay position). Same slim bar as the real overlay, so the user sees
# roughly what they're parking. Drag with Super+click.
windowrule = float on,           match:title ^(Jot Recorder Placement)$
windowrule = pin on,             match:title ^(Jot Recorder Placement)$
windowrule = center on,          match:title ^(Jot Recorder Placement)$
windowrule = rounding 10,        match:title ^(Jot Recorder Placement)$

# Image-preview dialog (zoom canvas)
windowrule = float on,           match:title ^(Image preview)$
windowrule = size 1000 760,      match:title ^(Image preview)$
windowrule = center on,          match:title ^(Image preview)$
windowrule = rounding 12,        match:title ^(Image preview)$

# Optional - uncomment to blur whatever is behind the window:
# layerrule = blur, com.amageweb.Jot
