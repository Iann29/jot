<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2230"/>
      <stop offset="1" stop-color="#0d0e14"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa9ff"/>
      <stop offset="1" stop-color="#6a7af0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Body -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#glow)"/>

  <!-- Subtle grid lines (like a notepad) -->
  <g opacity="0.10" stroke="#9aa9ff" stroke-width="1.2" stroke-linecap="round">
    <line x1="32" y1="48" x2="96" y2="48"/>
    <line x1="32" y1="64" x2="96" y2="64"/>
    <line x1="32" y1="80" x2="78" y2="80"/>
  </g>

  <!-- Pen stroke / J -->
  <path d="M84 30 C84 28, 86 26, 88 26 C90 26, 92 28, 92 30
           L92 76 C92 88, 84 96, 72 96 C60 96, 52 88, 52 78"
        stroke="url(#ink)" stroke-width="9" stroke-linecap="round"
        stroke-linejoin="round" fill="none" filter="url(#soft)"/>

  <!-- Dot (the "i" of jot, but as flourish above J) -->
  <circle cx="88" cy="18" r="4" fill="url(#ink)"/>
</svg>
