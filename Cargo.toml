[package]
name = "jot"
version = "1.7.1"
edition = "2021"
description = "Lightning-fast floating notes for Linux and Windows"
license = "MIT"
authors = ["Ian <admin@amageweb.com>"]
repository = "https://github.com/Iann29/jot"
readme = "README.md"
keywords = ["notes", "gtk4", "linux", "windows"]
categories = ["gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gdk = { package = "gdk4", version = "0.11" }
glib = "0.21"
gio = "0.21"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

# Voice transcription stack — Groq Whisper Large v3 Turbo, VAD-chunked.
# cpal captures continuously; a small RMS-based voice-activity detector
# slices speech into utterance-shaped chunks at silences; reqwest POSTs
# each chunk as multipart/form-data to Groq, which transcribes at
# ~216× real-time, so the perceived latency is ~one short pause.
cpal = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "blocking"] }
async-channel = "2"
serde_json = "1"

# Markdown export
slug = "0.1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

[target.'cfg(unix)'.dependencies]
# GIF recorder needs raw kill() so we can SIGINT wf-recorder (graceful
# MP4 flush). std::process::Child::kill() sends SIGKILL only. The whole
# capture pipeline is cfg(unix), and libc has no kill()/pid_t on Windows,
# so the dependency is gated exactly like the code that uses it.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# MessageBoxW only — the panic hook needs *some* visible channel because
# the exe is linked with the GUI subsystem, where stderr is a null handle.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the app icon + a longPathAware manifest into jot.exe (build.rs).
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Mirror release optimisation but keep debug symbols, so we can resolve
# panic backtraces with addr2line when something blows up in the wild.
[profile.release-debug]
inherits = "release"
strip = false
debug = "line-tables-only"
