[package]
name = "jot"
version = "0.1.0"
edition = "2021"
description = "Lightning-fast floating notes for tiling Wayland compositors"
license = "MIT"
authors = ["Ian <admin@amageweb.com>"]
repository = "https://github.com/Iann29/jot"
readme = "README.md"
keywords = ["notes", "gtk4", "linux", "hyprland", "wayland"]
categories = ["gui"]

[dependencies]
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gdk = { package = "gdk4", version = "0.11" }
glib = "0.21"
gio = "0.21"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "backup"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
